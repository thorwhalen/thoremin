<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play Along Lessons</title>
    <link rel="stylesheet" href="./src/play.css" />
  </head>
  <body>
    <header>
      <h1>Play Along Lessons</h1>
      <select id="lesson" aria-label="Lesson"></select>
      <select id="difficulty" aria-label="Difficulty"></select>
      <button id="start">Start</button>
      <p class="hint">Notes travel to the line: clap, tap the table, or sing or play each one as it arrives. Each is judged perfect, great or good, early or late. Measure your timing first (Audio timing). <a class="home" href="./">More games</a></p>
      <p class="hint" id="timing"></p>
    </header>
    <canvas id="stage"></canvas>
    <script type="module" src="./src/play_along.ts"></script>
  </body>
