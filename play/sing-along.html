<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sing Along</title>
    <link rel="stylesheet" href="./src/play.css" />
  </head>
  <body>
    <header>
      <h1>Sing Along</h1>
      <select id="lesson" aria-label="Lesson"></select>
      <select id="difficulty" aria-label="Difficulty"></select>
      <button id="start">Start</button>
      <p class="hint">A melody scrolls past the line: sing each note as it passes (any octave counts). The bars fill where your voice is on the note. Headphones help. <a class="home" href="./">More games</a></p>
      <p class="hint" id="timing"></p>
    </header>
    <canvas id="stage"></canvas>
    <script type="module" src="./src/sing_along.ts"></script>
  </body>
</html>
