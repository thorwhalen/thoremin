<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Echo the Rhythm</title>
    <link rel="stylesheet" href="./src/play.css" />
  </head>
  <body>
    <header>
      <h1>Echo the Rhythm</h1>
      <select id="level" aria-label="Level"></select>
      <select id="difficulty" aria-label="Difficulty"></select>
      <label class="hint"><input type="checkbox" id="click-answer" /> Metronome while I answer (headphones)</label>
      <button id="start">Start</button>
      <p class="hint">Listen to a bar of rhythm over a quiet metronome. Then the count, 1, 2, 3, 4, and clap it back (or tap the table). Each bar on its own, then all of them together. <a class="home" href="./">More games</a></p>
      <p class="hint" id="timing"></p>
    </header>
    <canvas id="stage"></canvas>
    <script type="module" src="./src/echo.ts"></script>
  </body>
</html>
