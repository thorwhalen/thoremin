<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Match the Note</title>
    <link rel="stylesheet" href="./src/play.css" />
  </head>
  <body>
    <header>
      <h1>Match the Note</h1>
      <select id="lesson" aria-label="Lesson"></select>
      <select id="difficulty" aria-label="Difficulty"></select>
      <button id="start">Start</button>
      <p class="hint">A note plays: find it with your voice or any instrument, in any octave, and hold it in tune until the ring fills. Headphones help, so the microphone does not hear the note itself. <a class="home" href="./">More games</a></p>
    </header>
    <canvas id="stage"></canvas>
    <script type="module" src="./src/match_the_note.ts"></script>
  </body>
</html>
