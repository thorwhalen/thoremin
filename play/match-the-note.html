<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Match the Note</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0b1020; color: #e5e7eb; font: 15px system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; }
      header h1 { font-size: 17px; margin: 0 8px 0 0; }
      select, button { font: inherit; background: #1e293b; color: inherit; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; }
      button { background: #2563eb; border-color: #2563eb; cursor: pointer; min-width: 5em; }
      .hint { flex-basis: 100%; color: rgba(229, 231, 235, 0.6); font-size: 13px; }
      .hint a { color: #93c5fd; }
      canvas { flex: 1; width: 100%; min-height: 0; display: block; }
    </style>
  </head>
  <body>
    <header>
      <h1>Match the Note</h1>
      <select id="lesson" aria-label="Lesson"></select>
      <select id="difficulty" aria-label="Difficulty"></select>
      <button id="start">Start</button>
      <p class="hint">A note plays: find it with your voice or any instrument, in any octave, and hold it in tune until the ring fills. Headphones help, so the microphone does not hear the note itself. Part of <a href="../">thoremin</a>.</p>
    </header>
    <canvas id="stage"></canvas>
    <script type="module" src="/play/src/match_the_note.ts"></script>
  </body>
</html>
