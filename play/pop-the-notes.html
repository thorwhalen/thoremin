<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pop the Notes</title>
    <link rel="stylesheet" href="./src/play.css" />
  </head>
  <body>
    <header>
      <h1>Pop the Notes</h1>
      <select id="difficulty" aria-label="Difficulty"></select>
      <select id="loudness" aria-label="Loudness range"></select>
      <button id="start">Start</button>
      <p class="hint">Sing or hum: your note moves the dot across (one octave, it wraps round), your loudness moves it up. Hold the dot on a balloon until it bursts. <a class="home" href="./">More games</a></p>
    </header>
    <canvas id="stage"></canvas>
    <script type="module" src="./src/pop_the_notes.ts"></script>
  </body>
</html>
