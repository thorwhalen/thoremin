<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vowels</title>
    <link rel="stylesheet" href="./src/play.css" />
  </head>
  <body>
    <header>
      <h1>Vowels</h1>
      <select id="mode" aria-label="Mode"></select>
      <select id="difficulty" aria-label="Difficulty"></select>
      <select id="voice" aria-label="Voice"></select>
      <button id="start">Start</button>
      <p class="hint">Touch the chart and hold to hear a vowel; slide to glide between them. Press Start and say a long vowel ("eee", "ooo", "aaa"): a dot shows where it sits. In Vowel Pop, hold the dot on a vowel's balloon until it bursts. <a class="home" href="./">More games</a></p>
    </header>
    <canvas id="stage"></canvas>
    <script type="module" src="./src/vowels.ts"></script>
  </body>
</html>
