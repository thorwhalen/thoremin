# The test gate.
#
# Until this file existed, `.github/workflows/` held exactly one workflow —
# deploy.yml — and main AUTO-DEPLOYS to production. So an untested change went
# live with nothing standing in the way: typecheck/test/build were local-only
# conventions, enforced by whoever remembered to run them. docs/TESTING.md even
# claimed "Tiers 1-3 are the CI gate: npm test", which was an aspiration, not a
# fact.
#
# This workflow makes the claim true. It runs the same three commands the repo
# already documents as its gate, in the same order a developer would:
#
#   npm run typecheck   strict DAG typecheck (tsconfig.dag.json)
#   npm test            vitest, Node env, no camera/GPU/audio
#   npm run build       vite build — this is what verifies the React layer,
#                       which tsconfig.dag.json deliberately does not cover
#
# It runs on pull_request (so a change is gated BEFORE it can merge) and on
# push to main (so the deploy that fires from the same push has a visible
# verdict beside it). It deliberately does NOT gate deploy.yml: making the
# deploy `needs:` this job would be a behaviour change to the deploy path, and
# is a separate decision. Today the value is the signal — a red X on the PR.
#
# Fast by design: one Node version, npm cache on, no matrix. The suite is
# ~900 tests in ~5s; the wall time here is dominated by `npm ci` and the vite
# build, which is why the cache matters more than parallelism.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref makes the older run's verdict irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install (lockfile-exact)
        run: npm ci

      - name: Typecheck (strict DAG)
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

      - name: Test the listening-games slice the camera build leaves out (docs/design/apps.md)
        run: npm run test:lab

      # The node catalog (docs/CATALOG.md, public/catalog.json, public/manual.html) is generated
      # from the node registry and committed; a change to a node, a port or a param that did not
      # regenerate it leaves the manual describing another app. Regenerate and compare.
      - name: The generated node catalog is up to date
        run: |
          npm run catalog
          if ! git diff --exit-code -- docs/CATALOG.md public/catalog.json public/manual.html; then
            echo "::error::The node catalog is stale: run 'npm run catalog' and commit docs/CATALOG.md, public/catalog.json and public/manual.html."
            exit 1
          fi

      - name: Build (vite — verifies the React layer)
        run: npm run build

      # A lazy extension's code (extensions.json's `lazy` entries) is in no chunk the page
      # loads up front, only in chunks fetched by import() on demand
      # (docs/design/lazy-extensions.md).
      - name: Lazy extensions stay out of the initial chunks
        run: npm run check:lazy

      # A standalone game page (play/) loads only the games, the judge, the SDK's audio and the
      # audio-input hub: no graph engine, React, store, camera model or extension.
      - name: Standalone game pages carry only what a game needs
        run: npm run check:play

  # Core alone: thoremin must typecheck, test and build with NO extension listed
  # (extensions.core.json), so an extension stays something a deploy chooses and core
  # never quietly depends on one. Tests that exercise an extension skip themselves here
  # (`it.runIf(AIR)`, test/helpers/extensions.ts). See docs/design/instruments-as-graphs-and-extensions.md.
  core:
    name: core alone (no extensions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install (lockfile-exact)
        run: npm ci

      - name: Typecheck, test and build with no extensions
        run: npm run test:core

  # The React layer's type-error ratchet (#201). The gate above cannot see a type error in
  # the React layer: `npm run typecheck` excludes it and the
  # vite build type-erases, which is how #192 shipped a packages/dag API change that broke
  # `useEngine` with every gate green. This job runs tsc over that layer
  # (tsconfig.react.json) and fails when the error set DIFFERS from its committed baseline
  # (tsconfig.react.baseline.json): a new error is named, and a fixed one asks for the baseline
  # to be tightened in the same PR. The second step keeps the baseline honest the other way:
  # the committed file may never list MORE than main's does, so a re-baseline cannot carry a
  # new error in with a PR; the third that the config may not drop a still-present file
  # main's covers (that would hide its errors from the ratchet: #389). Its own job, like core, so its verdict is visible beside the
  # gate's and never hides it. See docs/TESTING.md.
  react-types:
    name: React layer type ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install (lockfile-exact)
        run: npm ci

      - name: Typecheck the React layer against its baseline
        run: npm run typecheck:react

      - name: The committed baseline never grew past main's
        run: |
          git fetch --no-tags --depth=1 origin main
          git show FETCH_HEAD:tsconfig.react.baseline.json > "$RUNNER_TEMP/main-baseline.json" || rm -f "$RUNNER_TEMP/main-baseline.json"
          npm run typecheck:react -- --against="$RUNNER_TEMP/main-baseline.json"

      - name: The config never stops covering a file main's covers
        run: |
          git fetch --no-tags --depth=1 origin main
          git show FETCH_HEAD:tsconfig.react.json > "$RUNNER_TEMP/main-tsconfig.react.json" || rm -f "$RUNNER_TEMP/main-tsconfig.react.json"
          npm run typecheck:react -- --against-config="$RUNNER_TEMP/main-tsconfig.react.json"
