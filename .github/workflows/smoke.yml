# The browser smoke job (#209).
#
# ci.yml is the gate the repo documents (typecheck / test / build), and none of it
# runs a browser. This job boots the BUILT bundle headless in Chromium and asks the
# two questions the gate cannot: does the shipped app actually play (engine ticking,
# audio up, overlay drawing, no uncaught error), and can a player reach every tool
# and every settings section from a cold load — the shipping rule, executed.
#
# Its own job on purpose: it installs a browser and takes longer than the whole
# vitest suite, so it must never slow the gate down or be skipped to keep the gate
# fast. Like ci.yml it is advisory to the deploy — a red verdict beside the PR, not
# a precondition. Whether it should gate anything is the maintainer's call, not this
# file's. (#201's React-layer type ratchet lives in ci.yml: it needs no browser.)
#
# The harness is a self-contained sub-project (`smoke/`): its Playwright dependency
# never enters the app's package.json or node_modules. Locally: `npm run smoke`.
#
# COST GATING (docs/CI_COST.md, #476). This is the expensive one of the two CI
# workflows: it installs a Chromium binary every run on top of the app install.
# So on a PR it runs only when the PR touches what a browser verdict is about:
# `src/`, `packages/`, `smoke/` (and the build inputs below). A docs-only PR
# does not trigger the workflow at all (a `paths` filter skips it before any
# runner starts, so it bills nothing). A push to main and a manual
# workflow_dispatch always run it. `ci.yml` runs on every push regardless.
# (A path-filtered workflow reports no check on a skipped PR: if the check is
# ever made required, #388, this needs a no-op twin job or a different gate.)
name: Browser smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "packages/**"
      - "smoke/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "extensions*.json"
      - "vite*.ts"
      - ".github/workflows/smoke.yml"
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The suite runs in three shards side by side (Playwright's --shard: whole files, balanced by
  # test count), each building and serving its own bundle, so no one job comes near the timeout
  # as the suite grows (one job took 14 min of 20 after the behaviour tests landed). The job
  # below them keeps the one check name a reader or a script waits on.
  smoke:
    name: built bundle, headless Chromium (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            smoke/package-lock.json

      # The plugins are private git dependencies (package.json, lockfile `git+ssh://`): one read-only
      # deploy key per repository (docs/CI_COST.md, "Private repositories"). GITHUB_TOKEN reaches only this repo.
      - name: Keys for the private plugin repositories
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.THOREMIN_ASL_DEPLOY_KEY }}
            ${{ secrets.THOREMIN_AR_DEPLOY_KEY }}

      - name: Install the app (lockfile-exact)
        run: npm ci

      - name: Install the harness (lockfile-exact) and Chromium
        run: |
          npm --prefix smoke ci --no-audit --no-fund
          npx --prefix smoke playwright install --with-deps chromium

      - name: Build, serve and smoke the bundle
        run: npm run smoke:run -- --shard=${{ matrix.shard }}/3
        env:
          CI: "1"

      - name: Keep the report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-shard-${{ matrix.shard }}
          path: |
            smoke/playwright-report
            smoke/test-results
          retention-days: 7

  # The single result of the three shards, under the job name the smoke always had.
  result:
    name: built bundle, headless Chromium
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: |
          echo "shards: ${{ needs.smoke.result }}"
          test "${{ needs.smoke.result }}" = success
